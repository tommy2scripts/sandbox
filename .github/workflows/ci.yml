name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate board data JSON
        run: |
          python3 - <<'PY'
          import json
          required = {
              'data/threads.json': ['threads'],
              'data/attention.json': ['items'],
              'data/activity.json': ['items'],
              'data/health.json': ['items'],
              'data/telemetry.json': ['stats'],
              'data/week.json': ['events'],
              'data/accounts.json': ['accounts'],
              'data/spending.json': ['categories'],
          }
          for path, keys in required.items():
              with open(path) as f:
                  data = json.load(f)
              for key in keys:
                  assert key in data, f"{path} is missing key {key}"
              print(f"ok {path}")
          PY

      - name: Check board entry points exist
        run: test -f index.html && test -f app.js && test -f styles.css
